<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sqorz Category Stats</title>
<script>
  (() => {
    const saved = localStorage.getItem('theme');
    const isDark = saved === 'dark' ||
      (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', isDark);
    if (saved) document.documentElement.dataset.themePref = saved;
  })();
</script>
<style>
  :root{
    --bg:#f1f4f8;
    --card:#ffffff; --card-soft:#f7fafc;
    --ink:#2c3845; --ink-2:#4a5868; --muted:#6a7886;
    --line:#e4ebf1; --line-strong:#cdd6e0;
    --accent:#6a8caf; --accent-vivid:#4a7ab5;
    --accent-hi:#506f8f; --accent-soft:#dde6ef; --accent-ink:#fff;
    --rose:#f0a8c2; --coral:#f4a89a; --peach:#f5c0a0; --apricot:#f5d4a0;
    --butter:#f0d878; --lime:#cfdf8c; --mint:#a8dcc4; --teal:#88ccd0;
    --sky:#a8c8e8; --blueberry:#a8b4e0; --lilac:#bdacd9; --lavender:#d0b6e0;
    --berry:#e09bc2; --grape:#c594d4;
    --good:#a8dcc4; --bad:#f5a8a8; --warn:#f5d294;
    --gold:#e8c574; --silver:#cdd2dc; --bronze:#d4a07c;
    --shadow:0 1px 2px rgba(60,90,120,.10), 0 10px 28px rgba(60,90,120,.14);
    --shadow-xl:0 2px 8px rgba(60,90,120,.16), 0 24px 56px rgba(60,90,120,.22);
    --radius:16px;
  }
  :root.dark{
    --bg:#1f262e; --card:#2a3340; --card-soft:#252e3a;
    --ink:#e4ebf2; --ink-2:#c2ccd8; --muted:#a4afbb;
    --line:#3a4250; --line-strong:#4d5666;
    --accent:#9bb5cf; --accent-hi:#b6cce0; --accent-soft:#3a4250;
    --rose:#f4b8cb; --coral:#f4b4a4; --peach:#f5cdac; --apricot:#f5dab0;
    --butter:#efdc8c; --lime:#d8e8a0; --mint:#b4e0c8; --teal:#a4d8d8;
    --sky:#b6d2eb; --blueberry:#b8c5e8; --lilac:#c8b8df; --lavender:#d6bce6;
    --berry:#e8a8c8; --grape:#cca4dc;
    --good:#b4e0c8; --bad:#f5b0b0; --warn:#f5d8a4;
    --gold:#eccc88; --silver:#d4d8e0; --bronze:#d8a888;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0; padding:0}
  :focus{outline:none}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
  .btn:focus-visible{outline:2px solid var(--accent-hi); outline-offset:3px}
  .control:focus-visible{outline:none}
  .topbar :focus-visible{outline-color:#fff}
  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    position:relative; overflow:hidden;
    color:#fff; padding:48px 24px 128px;
    background:linear-gradient(135deg, #2e4158 0%, #3f566f 35%, #6a8caf 70%, #8aa6c2 100%);
    transition:padding .25s ease;
  }
  .topbar::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(circle at 80% 0%, rgba(255,255,255,.22), transparent 55%),
               radial-gradient(circle at 10% 100%, rgba(30,50,80,.35), transparent 45%);
  }
  .topbar-inner{max-width:1180px; margin:0 auto; position:relative; z-index:1}
  .brand-row{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .brand{display:flex; align-items:center; gap:12px; font-weight:600; letter-spacing:.2px; color:#fff}
  .theme-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:36px; height:36px; padding:0;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22);
    color:#fff; border-radius:10px; cursor:pointer; font-size:18px; line-height:1;
    transition:background .15s, border-color .15s, transform .15s;
  }
  .theme-btn:hover{background:rgba(255,255,255,.2); border-color:rgba(255,255,255,.4)}
  .theme-btn:active{transform:scale(.95)}
  .brand .logo{
    width:40px; height:40px; border-radius:12px;
    background:rgba(255,255,255,.22); color:#fff;
    display:grid; place-items:center; font-weight:800; font-size:14px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.45);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  }
  .topbar h1{margin:24px 0 8px; font-size:34px; font-weight:800; letter-spacing:-1px; color:#fff; text-shadow:0 2px 14px rgba(20,35,60,.45)}
  .topbar p{margin:0; font-size:15px; max-width:min(600px,100%); color:#dce8f2; text-shadow:0 1px 6px rgba(20,35,60,.35); line-height:1.5}
  .topbar-link{
    display:inline-flex; align-items:center; gap:5px;
    color:rgba(255,255,255,.75); font-size:13px; text-decoration:none;
    border-bottom:1px solid rgba(255,255,255,.30);
    transition:color .15s, border-color .15s; margin-top:10px;
  }
  .topbar-link:hover{color:#fff; border-bottom-color:rgba(255,255,255,.65)}
  main{max-width:1180px; margin:-80px auto 40px; padding:0 24px 32px; position:relative; z-index:2}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow); margin-bottom:18px;
  }
  .filters{padding:20px}
  .grid{display:grid; gap:14px}
  .filters-row{grid-template-columns:repeat(12,1fr); align-items:end}
  .field{display:flex; flex-direction:column; min-width:0}
  .field.col-year{grid-column:span 3}
  .field.col-cat{grid-column:span 7}
  .field.col-btn{grid-column:span 2; align-items:stretch}
  @media(max-width:880px){
    .field.col-year,.field.col-cat,.field.col-btn{grid-column:span 12}
  }
  label{font-size:11px; font-weight:600; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px}
  .control{
    font:inherit; padding:10px 12px; border:1px solid var(--line);
    border-radius:9px; background:var(--card); color:var(--ink);
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .control:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%, transparent)}
  .control:disabled{background:var(--card-soft); color:var(--muted); cursor:not-allowed}
  select.control{width:100%}
  .btn{
    font:inherit; font-weight:600; padding:11px 18px; border:none; border-radius:9px;
    background:var(--accent); color:var(--accent-ink); cursor:pointer;
    transition:background .15s, transform .05s;
  }
  .btn:hover:not(:disabled){background:var(--accent-hi)}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .btn:disabled{background:var(--line-strong); color:var(--card); cursor:not-allowed}
  .status{font-size:13px; color:var(--muted); margin-top:14px; min-height:18px}
  .status.error{color:var(--bad)}
  .status.loading{font-size:15px; color:var(--accent); font-weight:600; display:flex; align-items:center; gap:8px}
  .status.loading::before{content:''; display:inline-block; width:16px; height:16px; border:2px solid color-mix(in srgb,var(--accent) 30%,transparent); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; flex-shrink:0}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Org selector */
  .org-selector{margin-bottom:14px}
  .org-selector-summary{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:600; color:var(--ink-2);
    cursor:pointer; padding:7px 12px;
    background:var(--card-soft); border:1px solid var(--line);
    border-radius:8px; user-select:none;
    transition:border-color .15s, background .15s;
  }
  .org-selector-summary:hover{border-color:var(--accent); background:color-mix(in srgb,var(--accent) 8%, transparent)}
  .org-selector-panel{
    margin-top:8px; padding:10px 12px;
    background:var(--card-soft); border:1px solid var(--line); border-radius:10px;
  }
  .org-selector-panel[hidden]{display:none}
  .org-selector-actions{
    display:flex; gap:8px; margin-bottom:8px; padding-bottom:8px;
    border-bottom:1px dashed var(--line);
  }
  .org-selector-actions button{
    font:inherit; font-size:11.5px; font-weight:600;
    padding:4px 10px; border-radius:6px; cursor:pointer;
    background:var(--card); border:1px solid var(--line-strong); color:var(--ink-2);
    transition:border-color .15s, background .15s;
  }
  .org-selector-actions button:hover{border-color:var(--accent); color:var(--accent-hi)}
  .org-selector-list{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:4px 12px; max-height:240px; overflow-y:auto;
  }
  .org-selector-item{
    display:flex; align-items:center; gap:7px;
    font-size:12.5px; color:var(--ink-2); cursor:pointer;
    padding:3px 4px; border-radius:5px; transition:background .1s;
  }
  .org-selector-item:hover{background:color-mix(in srgb,var(--accent) 8%, transparent)}
  .org-selector-item input[type=checkbox]{accent-color:var(--accent); width:14px; height:14px; flex-shrink:0; cursor:pointer}


  /* Ranking table */
  .ranking-table{width:100%; border-collapse:collapse; font-size:12px}
  .ranking-table th{
    cursor:pointer; user-select:none; background:var(--card-soft);
    padding:7px 6px; text-align:right; white-space:nowrap;
    border-bottom:2px solid var(--line-strong);
    position:sticky; top:0; z-index:1;
  }
  .ranking-table th.no-sort{cursor:default}
  .ranking-table th.sorted{color:var(--accent)}
  .ranking-table th:first-child,.ranking-table td:first-child{text-align:center; min-width:32px; padding-left:10px}
  .ranking-table th:nth-child(2),.ranking-table td:nth-child(2){text-align:left; min-width:120px}
  .ranking-table td{padding:6px 6px; border-bottom:1px solid var(--line); text-align:right}
  .ranking-table th:last-child,.ranking-table td:last-child{padding-right:12px}
  .ranking-table tbody tr:nth-child(even) td{background:color-mix(in srgb, var(--card-soft) 70%, transparent)}
  .ranking-table tbody tr.pilot-row{cursor:pointer}
  .ranking-table tbody tr.pilot-row:hover td{background:var(--accent-soft) !important}
  .pilot-age{font-size:11px; color:var(--muted); margin-left:2px}

  /* Rank pills (small) */
  .rpill{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:28px; height:28px; border-radius:50%; font-weight:700; font-size:13px;
    background:var(--card-soft); border:2px solid var(--line); color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .rpill.r1{background:linear-gradient(135deg,#fff2c8,#e8c574); border-color:var(--gold); color:#7a5a18}
  .rpill.r2{background:linear-gradient(135deg,#f4f6fa,#cdd2dc); border-color:var(--silver); color:#4a5260}
  .rpill.r3{background:linear-gradient(135deg,#f7dcc4,#d4a07c); border-color:var(--bronze); color:#7a4a2a}
  .wins-badge{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:26px; height:26px; border-radius:50%; font-weight:700; font-size:12px;
    background:linear-gradient(135deg,#fff2c8,#e8c574); border:2px solid var(--gold); color:#7a5a18;
    font-variant-numeric:tabular-nums;
  }

  /* Category stats bar */
  .cat-stats-bar{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; padding:12px 16px; position:sticky; top:0; z-index:15}
  .cat-stats{display:flex; gap:20px; flex-wrap:wrap}
  .cat-stat{display:flex; flex-direction:column; align-items:center; gap:1px}
  .cat-stat-icon{font-size:18px; line-height:1; margin-bottom:2px}
  .cat-stat-v{font-size:17px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums}
  .cat-stat-k{font-size:10px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.5px}

  /* Pilot search */
  .pilot-search-wrap{display:flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:4px 8px}
  .pilot-search-wrap:focus-within{border-color:var(--accent); box-shadow:0 0 0 2px rgba(59,130,246,.18)}
  .pilot-search-icon{font-size:13px; color:var(--muted); flex-shrink:0}
  .pilot-search-input{border:none; outline:none; background:transparent; font:inherit; font-size:12px; color:var(--ink); width:140px}
  .pilot-search-input::placeholder{color:var(--muted)}
  .pilot-search-clear{border:none; background:none; cursor:pointer; color:var(--muted); font-size:14px; padding:0; line-height:1; display:none}
  .pilot-search-clear.visible{display:block}
  tr.row-hidden{display:none}
  tr.row-highlight td:nth-child(2){background:rgba(59,130,246,.08)}

  /* Year filter */
  .year-filter{display:flex; gap:5px}
  .yf-btn{
    font:inherit; font-size:12px; font-weight:600; cursor:pointer;
    padding:5px 12px; border-radius:99px;
    background:var(--card-soft); border:1px solid var(--line-strong); color:var(--ink-2);
    transition:border-color .15s, background .15s, color .15s;
  }
  .yf-btn:hover{border-color:var(--accent); color:var(--accent-hi)}
  .yf-btn.active{background:var(--accent); border-color:var(--accent); color:#fff}

  .empty-state{padding:36px; text-align:center; color:var(--muted); font-size:13px}
  .results-summary{font-size:12px; color:var(--muted); margin-bottom:10px}

  footer{
    text-align:center; padding:28px 24px 36px;
    font-size:12.5px; color:var(--muted);
    border-top:1px solid var(--line);
    display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap;
  }
  footer a{color:var(--accent); text-decoration:none}
  footer a:hover{text-decoration:underline}
  .footer-sep{color:var(--line-strong)}

  /* Pilot detail modal */
  .pilot-modal-overlay{
    position:fixed; inset:0; z-index:200;
    background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .pilot-modal-overlay.open{opacity:1; pointer-events:auto}
  .pilot-modal{
    background:var(--card); border-radius:16px 16px 0 0; width:100%; max-width:680px;
    max-height:85vh; display:flex; flex-direction:column;
    box-shadow:0 -8px 40px rgba(0,0,0,.25);
    transform:translateY(32px); transition:transform .25s cubic-bezier(.22,1,.36,1);
  }
  .pilot-modal-overlay.open .pilot-modal{transform:translateY(0)}
  .pilot-modal-header{
    position:relative; padding:16px 48px 16px 20px;
    border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .pilot-modal-name{font-size:17px; font-weight:700; color:var(--ink)}
  .pilot-modal-sub{font-size:12px; color:var(--muted); font-weight:500; margin-top:2px}
  .pilot-modal-close{
    position:absolute; top:12px; right:14px;
    border:none; background:none; cursor:pointer; font-size:20px; color:var(--muted);
    padding:4px; line-height:1; transition:color .15s;
  }
  .pilot-modal-close:hover{color:var(--ink)}
  .pilot-modal-body{overflow-y:auto; padding:12px 20px 24px; flex:1}
  .pilot-event-list{display:flex; flex-direction:column; gap:6px}
  .pilot-event-row{
    display:grid; grid-template-columns:90px 1fr auto;
    align-items:center; gap:8px; padding:8px 10px; border-radius:8px;
    border:1px solid var(--line); background:var(--bg);
    font-size:12px;
  }
  .pilot-event-date{color:var(--muted); font-size:11px; white-space:nowrap}
  .pilot-event-name{font-weight:600; color:var(--ink); line-height:1.3}
  .pilot-event-org{font-size:11px; color:var(--muted)}
  .pilot-event-rank{text-align:right; font-weight:700; font-size:14px; color:var(--ink); white-space:nowrap}
  .pilot-event-rank .rpill{font-size:11px}
  .pilot-event-phases{grid-column:1/-1; display:flex; gap:6px; flex-wrap:wrap; margin-top:2px}
  .phase-chip{
    font-size:10px; padding:2px 6px; border-radius:4px; font-weight:600;
    background:var(--card-soft); color:var(--muted); border:1px solid var(--line);
  }
  .phase-chip.win{background:#fef9c3; color:#92400e; border-color:#fde68a}
  .phase-chip.podium{background:#f0fdf4; color:#166534; border-color:#bbf7d0}
  .phase-chip.dnx{background:#fff1f2; color:#9f1239; border-color:#fecdd3}

  #backToTop{
    position:fixed; bottom:24px; right:24px; z-index:100;
    width:44px; height:44px; border-radius:50%; border:none;
    background:var(--accent); color:#fff;
    display:grid; place-items:center;
    cursor:pointer; font-size:20px; line-height:1;
    box-shadow:0 4px 16px rgba(0,0,0,.22);
    opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s, background .15s;
    transform:translateY(8px);
  }
  #backToTop.visible{opacity:1; pointer-events:auto; transform:translateY(0)}
  #backToTop:hover{background:var(--accent-hi)}

  @media(max-width:640px){
    /* Topbar */
    .topbar{padding:24px 16px 88px}
    .topbar h1{font-size:22px; letter-spacing:-.5px; margin-top:16px}
    .topbar p{font-size:13px}
    /* Main layout */
    main{padding:0 12px 20px; margin-top:-56px}
    .card{padding:12px; border-radius:12px; margin-bottom:12px}
    .filters{padding:12px}

    /* Org selector */
    .org-selector-list{grid-template-columns:1fr}
    .org-selector-panel{padding:8px 10px}

    /* Stats bar: stats pleine largeur, puis recherche */
    .cat-stats-bar{
      flex-wrap:wrap; gap:8px; padding:10px 12px;
    }
    .cat-stats{flex:1 1 100%; justify-content:space-around}
    .cat-stat-v{font-size:15px}
    .cat-stat-k{font-size:9px}
    .pilot-search-wrap{flex:1 1 0; min-width:0}
    .pilot-search-input{width:auto; flex:1; min-width:0}
    .year-filter{flex-shrink:0}

    /* Table : scroll horizontal, colonne # sticky */
    .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
    .ranking-table th{position:static}
    .ranking-table th,.ranking-table td{padding:5px 5px; white-space:nowrap}
    .ranking-table th:nth-child(2),.ranking-table td:nth-child(2){min-width:90px}
    .ranking-table th:nth-child(1){
      position:sticky; left:0; z-index:3;
      background:var(--card-soft);
      box-shadow:2px 0 6px rgba(0,0,0,.10);
    }
    .ranking-table td:nth-child(1){
      position:sticky; left:0; z-index:2;
      background:var(--card);
      box-shadow:2px 0 6px rgba(0,0,0,.10);
    }
    .ranking-table tbody tr:nth-child(even) td:nth-child(1){
      background:color-mix(in srgb, var(--card-soft) 85%, var(--card));
    }
    .ranking-table tbody tr.pilot-row:hover td:nth-child(1){
      background:var(--accent-soft) !important;
    }

    /* Modal */
    .pilot-modal{max-height:92vh}
    .pilot-modal-header{padding:14px 44px 14px 16px}
    .pilot-modal-close{top:10px; right:10px}
    .pilot-modal-body{padding:10px 14px 20px}
    .pilot-event-row{grid-template-columns:72px 1fr auto; gap:6px; padding:7px 8px}

    /* Bouton retour en haut */
    #backToTop{bottom:16px; right:14px; width:40px; height:40px; font-size:18px}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand-row">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="12" width="4" height="10" rx="1"/>
            <rect x="9" y="7" width="4" height="15" rx="1"/>
            <rect x="16" y="3" width="4" height="19" rx="1"/>
            <line x1="2" y1="22" x2="22" y2="22"/>
          </svg>
        </span>
        Sqorz Category Stats
      </div>
      <button type="button" id="themeBtn" class="theme-btn" aria-label="Changer le thème" title="Changer le thème (auto / clair / sombre)"></button>
    </div>
    <h1>Sqorz Category Stats</h1>
    <p>Comparez les performances de tous les pilotes d'une catégorie sur une saison — victoires, podiums, régularité — en agrégeant les résultats de toutes les organisations sélectionnées.</p>
  </div>
</div>

<main>
  <div class="card filters">
    <div class="org-selector" id="orgSelector">
      <div class="org-selector-summary" id="orgSelectorSummary" role="button" tabindex="0" aria-expanded="false" aria-controls="orgSelectorPanel">
        <span id="orgSelectorLabel">Chargement des orgas…</span>
        <span>▾</span>
      </div>
      <div class="org-selector-panel" id="orgSelectorPanel" hidden>
        <div class="org-selector-actions">
          <button type="button" id="orgSelectAll">Tout sélectionner</button>
          <button type="button" id="orgDeselectAll">Tout désélectionner</button>
        </div>
        <div class="org-selector-list" id="orgSelectorList"></div>
      </div>
    </div>
    <div class="grid filters-row">
      <div class="field col-year">
        <label for="rankYearSel">Année</label>
        <select id="rankYearSel" class="control">
        </select>
      </div>
      <div class="field col-cat">
        <label for="rankCatSel">Catégorie</label>
        <select id="rankCatSel" class="control" disabled>
          <option value="" disabled selected>Chargement…</option>
        </select>
      </div>
      <div class="field col-btn">
        <label>&nbsp;</label>
        <button id="rankBtn" class="btn" disabled>Rechercher</button>
      </div>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </div>

  <div id="results" aria-live="polite"></div>
</main>

<footer>
  <span>Données issues de <a href="https://our.sqorz.com/orgs" target="_blank" rel="noopener noreferrer">Sqorz</a></span>
  <span class="footer-sep">·</span>
  <span>© <span id="footerYear"></span></span>

</footer>
<script>document.getElementById('footerYear').textContent = new Date().getFullYear();</script>

<div class="pilot-modal-overlay" id="pilotModalOverlay" role="dialog" aria-modal="true">
  <div class="pilot-modal">
    <div class="pilot-modal-header">
      <div class="pilot-modal-name" id="pilotModalName"></div>
      <div class="pilot-modal-sub" id="pilotModalSub"></div>
      <button class="pilot-modal-close" id="pilotModalClose" aria-label="Fermer">✕</button>
    </div>
    <div class="pilot-modal-body" id="pilotModalBody"></div>
  </div>
</div>

<script>
(() => {
  const INDEX_URL = 'https://raw.githubusercontent.com/LudSoc/sqorz-stats/main/pilots-index.json';

  function humanError(e) {
    if (!e) return 'Erreur inconnue.';
    if (e.name === 'AbortError') return 'Annulé.';
    const msg = e.message || String(e);
    if (/HTTP 5\d\d/.test(msg)) return 'Sqorz est momentanément indisponible.';
    if (/HTTP 4\d\d/.test(msg)) return 'Sqorz refuse la requête.';
    if (/network|fetch failed|Failed to fetch|NetworkError/i.test(msg)) return 'Pas de réseau. Vérifie ta connexion.';
    return msg;
  }

  const norm = s => (s || '')
    .toString()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9 ]+/g, ' ')
    .trim()
    .replace(/\s+/g, ' ');

  // Normalisation catégorie : idem norm + singularise les mots (garcons→garcon, filles→fille…)
  const normCat = s => {
    const words = norm(s).split(' ');
    return words
      .map(w => w.length > 2 && w.endsWith('s') ? w.slice(0, -1) : w)
      .filter(w => w !== 'an')
      .join(' ');
  };

  const escape = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])
  );

  // --- State ---
  let pilotsIndex = null;
  let accounts = [];
  let selectedCodes = new Set();
  let globalDataReady = false;

  function expandIndex(idx) {
    for (const ev of (idx.events || [])) {
      for (const cls of (ev.classes || [])) {
        for (const c of (cls.competitors || [])) {
          c.firstName = c.fn; c.lastName = c.ln; c.groupName = c.gn;
          c.competitorRankDetails = (c.d || []).map(d => ({
            phaseName: d.n, result: d.r,
            ...(d.rp  != null ? { racePosition:  d.rp  } : {}),
            ...(d.pc         ? { phaseCode:      d.pc  } : {}),
            ...(d.pbc        ? { phaseBlockCode: d.pbc } : {}),
            ...(d.rn  != null ? { raceName:       d.rn  } : {}),
          }));
        }
      }
    }
    return idx;
  }

  async function loadIndex() {
    statusEl.classList.add('loading');
    setStatus('Chargement des données…');
    rankCatSel.innerHTML = '<option value="" disabled selected>Chargement…</option>';
    rankCatSel.disabled = true;
    rankBtn.disabled = true;
    try {
      const res = await fetch(INDEX_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      pilotsIndex = expandIndex(await res.json());
      accounts = (pilotsIndex.orgs || []).slice().sort((a, b) => a.accountName.localeCompare(b.accountName, 'fr'));
      for (const a of accounts) {
        if (isDefaultOrg(a.accountName)) selectedCodes.add(a.accountCode);
      }
      renderOrgSelectorList();
      updateOrgSelectorUI();
      globalDataReady = true;
      updateRankingForm();
      statusEl.classList.remove('loading');
      setStatus('');
    } catch(e) {
      statusEl.classList.remove('loading');
      setStatus('Impossible de charger l\'index : ' + humanError(e), true);
    }
  }

  // --- DOM refs ---
  const statusEl = document.getElementById('status');
  const resultsEl = document.getElementById('results');
  const rankYearSel = document.getElementById('rankYearSel');
  const rankCatSel = document.getElementById('rankCatSel');
  const rankBtn = document.getElementById('rankBtn');

  // --- Sorting state ---
  let currentRows = [];
  let currentSortCol = 'avgPct';
  let currentSortDir = 'asc';
  let currentClassName = '';
  let currentYearFilter = 'all';
  let currentEventCount = 0;

  // --- Org selector ---
  function isDefaultOrg(accountName) {
    const n = norm(accountName);
    return n.includes('bmx') && (n.includes('bourgogne') || n.includes('grand est'));
  }

  function updateOrgSelectorUI() {
    const label = document.getElementById('orgSelectorLabel');
    if (label) label.textContent = `${selectedCodes.size} orga(s) sélectionnée(s)`;
    document.querySelectorAll('#orgSelectorList input[type=checkbox]').forEach(cb => {
      cb.checked = selectedCodes.has(cb.value);
    });
  }

  function renderOrgSelectorList() {
    const list = document.getElementById('orgSelectorList');
    if (!list) return;
    list.innerHTML = accounts.map(a => {
      const checked = selectedCodes.has(a.accountCode) ? ' checked' : '';
      return `<label class="org-selector-item">
        <input type="checkbox" value="${escape(a.accountCode)}"${checked}>
        <span>${escape(a.accountName)}</span>
      </label>`;
    }).join('');
    list.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.addEventListener('change', () => {
        if (cb.checked) selectedCodes.add(cb.value);
        else selectedCodes.delete(cb.value);
        updateOrgSelectorUI();
        // Reload data for new org selection
        onOrgSelectionChanged();
      });
    });
  }

  function onOrgSelectionChanged() {
    updateRankingForm();
  }

  // Org selector panel toggle
  const orgSummary = document.getElementById('orgSelectorSummary');
  const orgPanel = document.getElementById('orgSelectorPanel');
  orgSummary.addEventListener('click', () => {
    const isOpen = !orgPanel.hidden;
    orgPanel.hidden = isOpen;
    orgSummary.setAttribute('aria-expanded', String(!isOpen));
  });
  orgSummary.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); orgSummary.click(); }
  });
  document.getElementById('orgSelectAll').addEventListener('click', () => {
    accounts.forEach(a => selectedCodes.add(a.accountCode));
    updateOrgSelectorUI();
    onOrgSelectionChanged();
  });
  document.getElementById('orgDeselectAll').addEventListener('click', () => {
    selectedCodes.clear();
    updateOrgSelectorUI();
    onOrgSelectionChanged();
  });

  // --- Status ---
  function setStatus(msg, isError = false) {
    statusEl.textContent = msg || '';
    statusEl.classList.toggle('error', isError);
  }

  // --- Form update after load ---
  function updateRankingForm() {
    if (!pilotsIndex) return;
    const year = rankYearSel.value;
    const classMap = new Map();
    for (const { account, event, classes } of (pilotsIndex.events || [])) {
      if (!selectedCodes.has(account.accountCode)) continue;
      if (year && !(event.eventDate || '').startsWith(year + '-')) continue;
      for (const cls of (classes || [])) {
        if (!cls.className) continue;
        const key = normCat(cls.className);
        if (!classMap.has(key)) classMap.set(key, cls.className);
      }
    }
    // Tri alphabétique sur la clé normalisée
    const sorted = [...classMap.entries()].sort((a, b) => a[0].localeCompare(b[0], 'fr'));

    const prevKey = normCat(rankCatSel.value);
    rankCatSel.innerHTML = '';
    rankCatSel.disabled = false;
    if (sorted.length === 0) {
      rankCatSel.innerHTML = '<option value="" disabled selected>Aucune catégorie trouvée</option>';
      rankCatSel.disabled = true;
    } else {
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.disabled = true;
      placeholder.textContent = 'Choisir une catégorie…';
      rankCatSel.appendChild(placeholder);
      let restored = false;
      for (const [key, cn] of sorted) {
        const opt = document.createElement('option');
        opt.value = cn;
        opt.textContent = cn.trim();
        if (prevKey && key === prevKey) { opt.selected = true; restored = true; }
        rankCatSel.appendChild(opt);
      }
      if (!restored) placeholder.selected = true;
    }
    updateRankBtnEnabled();
  }

  function updateRankBtnEnabled() {
    rankBtn.disabled = !globalDataReady || !rankCatSel.value;
  }

  rankCatSel.addEventListener('change', updateRankBtnEnabled);
  rankYearSel.addEventListener('change', () => {
    updateRankingForm();
    if (currentRows.length > 0) searchRanking();
  });

  // --- Stats computation (from test_sqorz) ---
  function isFinalPhase(d) {
    const n = (d.phaseName || '').toLowerCase();
    return /final/.test(n) && !/semi|quarter|1\/|eighth|repech/.test(n);
  }
  function isMotoPhase(d) {
    return /^moto/i.test(d.phaseName || '');
  }
  function isSemiPhase(d) {
    return /semi/i.test(d.phaseName || '');
  }
  function isKnockoutPhase(d) {
    const n = (d.phaseName || '').toLowerCase();
    return (/final/.test(n) || /1\/\d+/.test(n)) && !/repech/.test(n);
  }

  function percentile(rank, total) {
    if (!total || total < 2 || typeof rank !== 'number') return null;
    return Math.max(1, Math.round(100 * rank / total));
  }

  function computeStats(matches) {
    const s = {
      entries: matches.length,
      wins: 0, podiums: 0, top8: 0,
      finalsReached: 0, qualifReached: 0,
      manchesRaced: 0, mancheTop4: 0,
      bestRank: null,
      rankSum: 0, rankCount: 0,
      pctSum: 0, pctCount: 0,
      ageMap: new Map(),
      dominantAge: null,
    };
    for (const m of matches) {
      const c = m.competitor;
      if (typeof c.age === 'number') {
        s.ageMap.set(c.age, (s.ageMap.get(c.age) || 0) + 1);
      }
      if (typeof c.rank === 'number') {
        if (c.rank === 1) s.wins++;
        if (c.rank <= 3) s.podiums++;
        if (c.rank <= 8) s.top8++;
        if (s.bestRank == null || c.rank < s.bestRank) s.bestRank = c.rank;
        s.rankSum += c.rank;
        s.rankCount++;
      }
      const pct = percentile(c.rank, m.totalParticipants);
      if (pct != null) {
        s.pctSum += pct;
        s.pctCount++;
      }
      const details = c.competitorRankDetails || [];
      const finalPh = details.find(isFinalPhase);
      if (finalPh && finalPh.result != null) s.finalsReached++;
      if (details.some(d => isKnockoutPhase(d) && d.result != null)) s.qualifReached++;
      for (const d of details) {
        if (isMotoPhase(d) && d.result != null) {
          s.manchesRaced++;
          if (d.result <= 4) s.mancheTop4++;
        }
      }
    }
    s.avgRank = s.rankCount ? s.rankSum / s.rankCount : null;
    s.avgPct = s.pctCount ? s.pctSum / s.pctCount : null;
    if (s.ageMap.size) {
      s.dominantAge = [...s.ageMap.entries()].sort((a, b) => b[1] - a[1])[0][0];
    }
    return s;
  }

  // --- Main search ---
  function searchRanking() {
    const year = rankYearSel.value;
    const className = rankCatSel.value;
    if (!className) { setStatus('Choisir une catégorie.', true); return; }
    currentClassName = className;
    currentYearFilter = 'all';

    const pilotMap = new Map(); // normKey → {firstName, lastName, matches[]}
    const eventIds = new Set();

    for (const { account, event, classes } of (pilotsIndex.events || [])) {
      if (!selectedCodes.has(account.accountCode)) continue;
      if (year && !(event.eventDate || '').startsWith(year + '-')) continue;
      for (const cls of (classes || [])) {
        if (normCat(cls.className) !== normCat(className)) continue;
        eventIds.add(event.eventId);
        const competitors = cls.competitors || [];
        for (const c of competitors) {
          const key = norm((c.firstName || '') + ' ' + (c.lastName || ''));
          if (!key) continue;
          if (!pilotMap.has(key)) {
            pilotMap.set(key, { firstName: c.firstName || '', lastName: c.lastName || '', matches: [] });
          }
          pilotMap.get(key).matches.push({
            account, event,
            cls: { className: cls.className },
            competitor: c,
            totalParticipants: cls.total || competitors.length,
          });
        }
      }
    }

    currentEventCount = eventIds.size;

    if (pilotMap.size === 0) {
      const yearMsg = year ? ` en ${year}` : '';
      setStatus(`Aucun pilote trouvé dans la catégorie « ${className} »${yearMsg}.`);
      resultsEl.innerHTML = `<div class="card"><div class="empty-state">Aucun résultat pour « ${escape(className)} »${year ? ` en ${year}` : ''}.</div></div>`;
      currentRows = [];
      return;
    }

    const rows = [];
    for (const [key, pilot] of pilotMap) {
      const stats = computeStats(pilot.matches);
      rows.push({
        key,
        firstName: pilot.firstName,
        lastName: pilot.lastName,
        name: (pilot.firstName + ' ' + pilot.lastName).trim(),
        stats,
        matches: pilot.matches,
      });
    }

    const yearMsg = year ? ` (${year})` : '';
    setStatus(`${rows.length} pilote(s) trouvé(s) dans « ${className} »${yearMsg}.`);

    currentSortCol = 'wins';
    currentSortDir = 'desc';
    renderRankingTable(rows, 'wins', 'desc');
  }

  // --- Year filter ---
  function applyYearFilter(rows) {
    if (currentYearFilter === 'all') return rows;
    return rows.filter(r => {
      const age = r.stats.dominantAge;
      if (age == null) return true;
      return currentYearFilter === '1' ? age % 2 === 1 : age % 2 === 0;
    });
  }

  // --- Category stats ---
  function renderCategoryStats(rows) {
    const totalPilots = rows.length;
    const winners = rows.filter(r => r.stats.wins > 0).length;
    const stat = (icon, val, label) =>
      `<div class="cat-stat"><span class="cat-stat-icon">${icon}</span><span class="cat-stat-v">${val}</span><span class="cat-stat-k">${label}</span></div>`;
    return `<div class="cat-stats">
      ${stat('🚴', totalPilots, 'Pilotes')}
      ${stat('🥇', winners, 'Vainqueurs')}
      ${stat('🏁', currentEventCount, 'Événements')}
    </div>`;
  }

  function renderYearFilterBar() {
    const a = currentYearFilter;
    return `<div class="year-filter">
      <button class="yf-btn${a==='all'?' active':''}" data-yf="all">Toutes</button>
      <button class="yf-btn${a==='1'?' active':''}" data-yf="1">1ère année</button>
      <button class="yf-btn${a==='2'?' active':''}" data-yf="2">2ème année</button>
    </div>`;
  }

  // --- Render table ---
  const isUCat = () => /^U(7|9|11|13|15)\b/i.test(currentClassName);

  function buildCols() {
    const cols = [
      { key: null,            label: '#',               sortable: false },
      { key: 'name',          label: 'Pilote',          sortable: true },
    ];
    cols.push(
      { key: 'entries',       label: 'Eng.',            sortable: true },
      { key: 'wins',          label: 'Vict.',           sortable: true },
      { key: 'winRate',       label: '% Vict.',         sortable: true },
      { key: 'podiums',       label: 'Pod.',            sortable: true },
      { key: 'podiumRate',    label: '% Pod.',          sortable: true },
      { key: 'bestRank',      label: 'Meil.',           sortable: true },
      { key: 'avgRank',       label: 'Rang moy.',       sortable: true },

      { key: 'avgPct',        label: 'Pct. moy.',       sortable: true },
      { key: 'qualifRate',    label: '% Qualif.',       sortable: true },
      { key: 'finaleRate',    label: '% Finale',        sortable: true },
      { key: 'mancheTop4Rate',label: '% Mch.T4',        sortable: true },
    );
    return cols;
  }

  function getColValue(row, key) {
    const s = row.stats;
    switch (key) {
      case 'name':            return row.name.toLowerCase();
      case 'entries':         return s.entries;
      case 'wins':            return s.wins;
      case 'winRate':         return s.entries ? s.wins / s.entries : 0;
      case 'podiums':         return s.podiums;
      case 'podiumRate':      return s.entries ? s.podiums / s.entries : 0;
      case 'bestRank':        return s.bestRank ?? 9999;
      case 'avgRank':         return s.avgRank ?? 9999;

      case 'avgPct':          return s.avgPct ?? 9999;
      case 'qualifRate':      return s.entries ? s.qualifReached / s.entries : 0;
      case 'finaleRate':      return s.entries ? s.finalsReached / s.entries : 0;
      case 'mancheTop4Rate':  return s.manchesRaced ? s.mancheTop4 / s.manchesRaced : 0;
      default:                return 0;
    }
  }

  function renderRankingTable(rows, sortCol, sortDir) {
    currentRows = rows;
    currentSortCol = sortCol;
    currentSortDir = sortDir;

    // Apply year filter then sort
    const filteredRows = applyYearFilter(rows);
    const sorted = [...filteredRows].sort((a, b) => {
      const av = getColValue(a, sortCol);
      const bv = getColValue(b, sortCol);
      const cmp = typeof av === 'string' ? av.localeCompare(bv, 'fr') : av - bv;
      return sortDir === 'asc' ? cmp : -cmp;
    });

    // Headers
    const COLS = buildCols();
    const thHTML = COLS.map(col => {
      if (!col.sortable) return `<th class="no-sort">${col.label}</th>`;
      const isSorted = col.key === sortCol;
      const arrow = isSorted ? `<span class="sort-arrow">${sortDir === 'asc' ? '▲' : '▼'}</span>` : '';
      return `<th class="${isSorted ? 'sorted' : ''}" data-col="${col.key}">${escape(col.label)}${arrow}</th>`;
    }).join('');

    // Rows
    const rowsHTML = sorted.map((row, i) => {
      const s = row.stats;
      const rank = i + 1;
      const rankCell = rank === 1 ? `<span class="rpill r1">1</span>`
                     : rank === 2 ? `<span class="rpill r2">2</span>`
                     : rank === 3 ? `<span class="rpill r3">3</span>`
                     : rank;
      const ageStr = s.dominantAge != null ? ` <span class="pilot-age">(${s.dominantAge})</span>` : '';
      const pilotLink = `<span class="pilot-name">${escape(row.name)}</span>${ageStr}`;
      const winsCell = s.wins > 0
        ? `<span class="wins-badge">${s.wins}</span>`
        : `0`;
      const avgPctCell = s.avgPct != null ? `top ${Math.round(s.avgPct)}%` : '—';
      const avgRankCell = s.avgRank != null ? s.avgRank.toFixed(1) : '—';
      const bestRankCell = s.bestRank != null ? s.bestRank : '—';
      const winRateCell = s.entries ? Math.round(100 * s.wins / s.entries) + '%' : '—';
      const podiumRateCell = s.entries ? Math.round(100 * s.podiums / s.entries) + '%' : '—';
      const qualifRate = s.entries ? Math.round(100 * s.qualifReached / s.entries) + '%' : '—';
      const finaleRate = s.entries ? Math.round(100 * s.finalsReached / s.entries) + '%' : '—';
      const mancheTop4Rate = s.manchesRaced ? Math.round(100 * s.mancheTop4 / s.manchesRaced) + '%' : '—';

      return `<tr class="pilot-row" data-key="${escape(row.key)}" style="cursor:pointer">
        <td>${rankCell}</td>
        <td>${pilotLink}</td>
        <td>${s.entries}</td>
        <td>${winsCell}</td>
        <td>${winRateCell}</td>
        <td>${s.podiums}</td>
        <td>${podiumRateCell}</td>
        <td>${bestRankCell}</td>
        <td>${avgRankCell}</td>

        <td>${avgPctCell}</td>
        <td>${qualifRate}</td>
        <td>${finaleRate}</td>
        <td>${mancheTop4Rate}</td>
      </tr>`;
    }).join('');

    document.body.classList.add('has-results');
    const yearFilterHtml = isUCat() ? renderYearFilterBar() : '';
    resultsEl.innerHTML = `
      <div class="card cat-stats-bar">
        ${renderCategoryStats(rows)}
        <div class="pilot-search-wrap">
          <span class="pilot-search-icon">🔍</span>
          <input class="pilot-search-input" id="pilotSearchInput" type="search" placeholder="Rechercher un pilote…" autocomplete="off">
          <button class="pilot-search-clear" id="pilotSearchClear" title="Effacer">✕</button>
        </div>
        ${yearFilterHtml}
      </div>
      <div class="card" style="padding:0">
        <div class="table-scroll">
          <table class="ranking-table">
            <thead><tr>${thHTML}</tr></thead>
            <tbody>${rowsHTML}</tbody>
          </table>
        </div>
      </div>`;

    // Adjust sticky thead top to clear the sticky stats bar
    requestAnimationFrame(() => {
      const statsBar = resultsEl.querySelector('.cat-stats-bar');
      if (statsBar) {
        const offset = statsBar.offsetHeight;
        resultsEl.querySelectorAll('.ranking-table th').forEach(th => {
          th.style.top = offset + 'px';
        });
      }
    });

    // Pilot row click → detail modal
    const rowKeyMap = new Map(sorted.map(r => [r.key, r]));
    resultsEl.querySelectorAll('.pilot-row').forEach(tr => {
      tr.addEventListener('click', e => {
        const row = rowKeyMap.get(tr.dataset.key);
        if (row) openPilotDetail(row);
      });
    });

    // Sort click handlers
    resultsEl.querySelectorAll('.ranking-table th[data-col]').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.col;
        let dir = 'desc';
        if (col === currentSortCol) {
          dir = currentSortDir === 'asc' ? 'desc' : 'asc';
        } else {
          const ascFirst = ['bestRank', 'avgRank', 'avgPct', 'name'];
          dir = ascFirst.includes(col) ? 'asc' : 'desc';
        }
        renderRankingTable(currentRows, col, dir);
      });
    });

    // Year filter handlers
    resultsEl.querySelectorAll('.yf-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentYearFilter = btn.dataset.yf;
        renderRankingTable(currentRows, currentSortCol, currentSortDir);
      });
    });

    // Pilot search (live filter)
    const searchInput = document.getElementById('pilotSearchInput');
    const searchClear = document.getElementById('pilotSearchClear');
    const filterRows = () => {
      const q = norm(searchInput.value);
      searchClear.classList.toggle('visible', q.length > 0);
      resultsEl.querySelectorAll('.ranking-table tbody tr').forEach(tr => {
        const name = norm(tr.querySelector('td:nth-child(2)')?.textContent || '');
        tr.classList.toggle('row-hidden', q.length > 0 && !name.includes(q));
        tr.classList.toggle('row-highlight', q.length > 0 && name.includes(q));
      });
    };
    searchInput.addEventListener('input', filterRows);
    searchClear.addEventListener('click', () => { searchInput.value = ''; filterRows(); searchInput.focus(); });
  }

  // --- Search button ---
  rankBtn.addEventListener('click', () => {
    orgPanel.hidden = true;
    searchRanking();
  });

  // --- Theme toggle ---
  const themeBtn = document.getElementById('themeBtn');
  function updateThemeIcon() {
    const isDark = document.documentElement.classList.contains('dark');
    themeBtn.textContent = isDark ? '☀️' : '🌙';
  }
  themeBtn.addEventListener('click', () => {
    const isDark = document.documentElement.classList.contains('dark');
    const next = isDark ? 'light' : 'dark';
    document.documentElement.classList.toggle('dark', !isDark);
    document.documentElement.dataset.themePref = next;
    localStorage.setItem('theme', next);
    updateThemeIcon();
  });
  updateThemeIcon();

  // --- Pilot detail modal ---
  const overlay    = document.getElementById('pilotModalOverlay');
  const modalName  = document.getElementById('pilotModalName');
  const modalAge   = document.getElementById('pilotModalAge');
  const modalBody  = document.getElementById('pilotModalBody');
  const modalSub   = document.getElementById('pilotModalSub');
  const modalClose = document.getElementById('pilotModalClose');

  function openPilotDetail(row) {
    modalName.textContent = row.name;
    const age = row.stats.dominantAge;
    const yearLabel = age != null && isUCat()
      ? ` · ${age} ans · ${age % 2 === 1 ? '1ère année' : '2ème année'}`
      : age != null ? ` · ${age} ans` : '';
    // Club : groupName du match le plus récent
    const sorted0 = [...row.matches].sort((a, b) =>
      (b.event.eventDate || '').localeCompare(a.event.eventDate || ''));
    const club = sorted0[0]?.competitor?.groupName || '';
    const clubStr = club ? ` · ${club}` : '';
    modalSub.textContent = `${row.stats.entries} engagement(s)${yearLabel}${clubStr}`;

    const sorted = sorted0;

    const fmtDate = s => {
      if (!s) return '—';
      const [y, m, d] = s.split('-');
      return `${d}/${m}/${y}`;
    };

    const rankBadge = r => {
      if (r == null) return '—';
      if (r === 1) return `<span class="rpill r1">1</span>`;
      if (r === 2) return `<span class="rpill r2">2</span>`;
      if (r === 3) return `<span class="rpill r3">3</span>`;
      return `<span style="font-size:13px">${r}</span>`;
    };

    const rows = sorted.map(m => {
      const c = m.competitor;
      const fmtResult = r => {
        if (r >= 103000) return 'DSQ';
        if (r >= 101000) return 'DNS';
        if (r >= 100000) return 'DNF';
        return String(r);
      };
      const phases = (c.competitorRankDetails || [])
        .filter(d => d.result != null)
        .map(d => {
          const isDnx = d.result >= 100000;
          let cls = 'phase-chip';
          if (!isDnx && d.result === 1) cls += ' win';
          else if (!isDnx && d.result <= 3) cls += ' podium';
          else if (isDnx) cls += ' dnx';
          const label = (d.phaseName || '').replace(/^moto\s*/i, 'Manche ');
          return `<span class="${cls}">${escape(label)} · ${fmtResult(d.result)}</span>`;
        }).join('');
      return `<div class="pilot-event-row">
        <div class="pilot-event-date">${fmtDate(m.event.eventDate)}</div>
        <div>
          <div class="pilot-event-name">${escape(m.event.eventName || '')}</div>
          <div class="pilot-event-org">${escape(m.account.accountName || '')}</div>
        </div>
        <div class="pilot-event-rank">
          ${rankBadge(c.rank)}
          <span style="font-size:11px;color:var(--muted);font-weight:400"> /${m.totalParticipants}</span>
        </div>
        ${phases ? `<div class="pilot-event-phases">${phases}</div>` : ''}
      </div>`;
    }).join('');

    modalBody.innerHTML = `<div class="pilot-event-list">${rows}</div>`;
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closePilotDetail() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  modalClose.addEventListener('click', closePilotDetail);
  overlay.addEventListener('click', e => { if (e.target === overlay) closePilotDetail(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePilotDetail(); });

  // --- Year selector population ---
  (() => {
    const currentYear = new Date().getFullYear();
    const frag = document.createDocumentFragment();
    for (let y = currentYear; y >= 2023; y--) {
      const opt = document.createElement('option');
      opt.value = String(y);
      opt.textContent = String(y);
      frag.appendChild(opt);
    }
    rankYearSel.appendChild(frag);
  })();

  // --- Init ---
  (async function init() {
    await loadIndex();
  })();
})();
</script>

<button id="backToTop" aria-label="Retour en haut" title="Retour en haut">↑</button>
<script>
  (() => {
    const btn = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      btn.classList.toggle('visible', window.scrollY > 300);
    }, { passive: true });
    btn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  })();
</script>
</body>
</html>
